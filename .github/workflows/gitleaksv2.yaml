name: gitleaksv2
on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OUTPUT_FILE: results.sarif
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        id: scan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
      - id: results
        shell: bash
        run: |
          if [[ -f "$OUTPUT_FILE" ]]; then
            count=$(jq -r '[.runs[].results[]] | length' "$OUTPUT_FILE" 2>/dev/null || echo 0)
          else
            count=0
          fi
          echo "results=$count" >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@v2.1.1
        if: steps.results.outputs.results != null
        with:
          method: chat.postMessage
          token: ${{ secrets.SECURITY_NOTIFIER_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ vars.SECURITY_NOTIFIER_SLACK_CHANNEL_ID }}
            text: "Secret(s) detected: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || github.event.compare }}"

